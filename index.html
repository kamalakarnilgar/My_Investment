<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nilgar Family Finance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <h1>Nilgar Finance<span>Family ledger</span></h1>
    </div>
    <button class="ghost" id="btnCollapse" title="Collapse sidebar">☰</button>
    <nav class="side" id="sideNav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="crumb" id="pageCrumb">Overview of investments, cash flow and alerts</div>
      </div>
      <div class="row">
        <button class="ghost" id="btnSample">Load sample</button>
        <button class="ghost" id="btnExport">Export</button>
        <button class="ghost" id="btnImport">Import</button>
        <input id="fileImport" type="file" accept="application/json" hidden />
      </div>
    </div>
    <div class="content" id="view"></div>
  </main>
  <div class="toast" id="toast"></div>
  <div class="modal-bg" id="modalBg"><div class="modal card" id="modal"></div></div>
  <script src="app.js"></script>
</body>
</html>
